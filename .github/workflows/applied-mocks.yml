name: Ten applied mock exams
on:
  push:
    paths: ['src/**', '기출문제/모의고사/응용10회/**', 'tools/exams/*applied_mock*.py', '.github/workflows/applied-mocks.yml']
  pull_request:
    paths: ['src/**', '기출문제/모의고사/응용10회/**', 'tools/exams/*applied_mock*.py', '.github/workflows/applied-mocks.yml']
permissions:
  contents: read
jobs:
  applied-mocks:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r 기출문제/모의고사/응용10회/requirements-py312.txt
      - run: python tools/exams/run_applied_mocks.py
      - run: python tools/exams/audit_applied_mocks.py
