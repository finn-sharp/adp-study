name: Standard model modules
on: [push, pull_request]
jobs:
  models:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - python: '3.7'
            requirements: requirements-models-py37.txt
          - python: '3.12'
            requirements: requirements-models-py312.txt
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare legacy HDBSCAN build dependencies
        if: matrix.python == '3.7'
        run: python -m pip install numpy==1.21.6 Cython==0.29.37 wheel==0.38.4
      - name: Install legacy dependencies
        if: matrix.python == '3.7'
        run: python -m pip install --no-build-isolation -r ${{ matrix.requirements }}
      - name: Install modern dependencies
        if: matrix.python != '3.7'
        run: python -m pip install -r ${{ matrix.requirements }}
      - run: python -m unittest discover -s tests -v
      - name: Execute module examples
        run: |
          python -m src.MachineLearning.Trees.xgboost
          python -m src.MachineLearning.Trees.catboost
          python -m src.MachineLearning.Trees.lightgbm
          python -m src.MachineLearning.Trees.adaboost
          python -m src.MachineLearning.NeuralNetworks.mlp
          python -m src.MachineLearning.NeuralNetworks.perceptron
          python -m src.MachineLearning.LinearModels.linear_regression
          python -m src.MachineLearning.NeuralNetworks.adaline
          python -m src.stats.tests.parametric.Average.Multivariate.OneWay
          python -m src.stats.tests.parametric.Average.Multivariate.TwoWay
          python -m src.stats.tests.parametric.Average.Multivariate.MANOVA
          python -m src.stats.tests.parametric.Average.Multivariate.PostHoc
          python -m src.MachineLearning.Clustering.kmeans
          python -m src.MachineLearning.Clustering.dbscan
          python -m src.MachineLearning.Clustering.hdbscan
          python -m src.MachineLearning.Clustering.k_distance
          python -m src.MachineLearning.Decomposition.pca
          python -m src.MachineLearning.Decomposition.lda
          python -m src.MachineLearning.Decomposition.umap
          python -m src.MachineLearning.Decomposition.tsne
          python -m src.MachineLearning.Decomposition.mds
          python -m src.MachineLearning.Decomposition.som
          python -m src.MachineLearning.NaiveBayes.naive_bayes
          python -m src.MachineLearning.FeatureSelection.wrapper
          python -m src.MachineLearning.FeatureSelection.regularized
          python -m src.Association.apriori
          python -m src.Networks.sna
          python -m src.stats.tests.nonParametric.chi_square
          python -m src.stats.tests.nonParametric.independence
          python -m src.stats.tests.nonParametric.mcnemar
          python -m src.stats.tests.parametric.Variance.f_test
          python -m src.stats.tests.diagnostics.normality
          python -m src.stats.tests.diagnostics.homogeneity
  tensorflow:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - python: '3.7'
            requirements: requirements-tensorflow-py37.txt
          - python: '3.12'
            requirements: requirements-tensorflow-py312.txt
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: python -m unittest discover -s tests -p 'test_tensorflow_modules.py' -v
      - name: Execute TensorFlow module examples
        run: |
          python -m src.DeepLearning.TensorFlow.classification
          python -m src.DeepLearning.TensorFlow.regression
          python -m src.DeepLearning.TensorFlow.rnn
          python -m src.DeepLearning.TensorFlow.time_series
