name: Standard model modules
on: [push, pull_request]
jobs:
  models:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.7'
            requirements: requirements-models-py37.txt
          - python: '3.12'
            requirements: requirements-models-py312.txt
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare legacy HDBSCAN build dependencies
        if: matrix.python == '3.7'
        run: python -m pip install numpy==1.21.6 Cython==0.29.37 wheel==0.38.4
      - name: Install legacy dependencies
        if: matrix.python == '3.7'
        run: python -m pip install --no-build-isolation -r ${{ matrix.requirements }}
      - name: Install modern dependencies
        if: matrix.python != '3.7'
        run: python -m pip install -r ${{ matrix.requirements }}
      - name: Install optional optimization dependencies
        run: python -m pip install -r requirements-optimization-py${{ matrix.python == '3.7' && '37' || '312' }}.txt
      - run: python -m unittest discover -s tests -v
      - name: Execute module examples
        run: |
          python -m src.MachineLearning.Trees.xgboost
          python -m src.MachineLearning.Trees.catboost
          python -m src.MachineLearning.Trees.lightgbm
          python -m src.MachineLearning.Trees.adaboost
          python -m src.MachineLearning.NeuralNetworks.mlp
          python -m src.MachineLearning.NeuralNetworks.perceptron
          python -m src.MachineLearning.LinearModels.linear_regression
          python -m src.MachineLearning.NeuralNetworks.adaline
          python -m src.stats.tests.parametric.Average.anova.one_way
          python -m src.stats.tests.parametric.Average.anova.two_way
          python -m src.stats.tests.parametric.Multivariate.manova
          python -m src.stats.tests.parametric.Average.anova.posthoc
          python -m src.MachineLearning.Clustering.kmeans
          python -m src.MachineLearning.Clustering.dbscan
          python -m src.MachineLearning.Clustering.hdbscan
          python -m src.MachineLearning.Clustering.k_distance
          python -m src.MachineLearning.Decomposition.pca
          python -m src.MachineLearning.Decomposition.lda
          python -m src.MachineLearning.Decomposition.umap
          python -m src.MachineLearning.Decomposition.tsne
          python -m src.MachineLearning.Decomposition.mds
          python -m src.MachineLearning.Decomposition.som
          python -m src.MachineLearning.NaiveBayes.naive_bayes
          python -m src.MachineLearning.FeatureSelection.wrapper
          python -m src.MachineLearning.FeatureSelection.regularized
          python -m src.Association.apriori
          python -m src.Association.fp_growth
          python -m src.Association.eclat
          python -m src.Networks.sna
          python -m src.stats.tests.nonParametric.Categorical.chi_square
          python -m src.stats.tests.nonParametric.Categorical.independence
          python -m src.stats.tests.nonParametric.Categorical.mcnemar
          python -m src.stats.tests.parametric.Variance.f_test
          python -m src.stats.tests.diagnostics.normality
          python -m src.stats.tests.diagnostics.homogeneity
          python -m src.stats.tests.parametric.Average.one_sample
          python -m src.stats.tests.parametric.Average.two_sample
          python -m src.stats.tests.parametric.Average.paired
          python -m src.stats.tests.parametric.Variance.one_sample
          python -m src.stats.tests.parametric.Proportion.one_sample
          python -m src.stats.tests.parametric.Proportion.two_sample
          python -m src.stats.tests.nonParametric.Location.sign
          python -m src.stats.tests.nonParametric.Location.wilcoxon
          python -m src.stats.tests.nonParametric.Sequence.runs
          python -m src.stats.tests.nonParametric.Location.mann_whitney
          python -m src.stats.tests.nonParametric.Location.kruskal_wallis
          python -m src.stats.tests.nonParametric.Location.mood_median
          python -m src.stats.tests.nonParametric.Location.friedman
          python -m src.stats.tests.parametric.Average.anova.repeated_measures
          python -m src.stats.tests.diagnostics.anderson_darling
          python -m src.stats.tests.diagnostics.kolmogorov_smirnov
          python -m src.stats.tests.parametric.Multivariate.hotelling
          python -m src.stats.tests.diagnostics.box_m
          python -m src.stats.tests.Association.odds_ratio
          python -m src.stats.tests.Association.risk_ratio
          python -m src.stats.tests.nonParametric.Categorical.fisher_exact
          python -m src.stats.tests.Association.cmh
          python -m src.stats.tests.nonParametric.Categorical.bowker
          python -m src.stats.tests.nonParametric.Categorical.cochran_q
          python -m src.stats.tests.TimeSeries.adf
          python -m src.stats.tests.nonParametric.Categorical.homogeneity
          python -m src.stats.distributions.bernoulli
          python -m src.stats.distributions.binomial
          python -m src.stats.distributions.normal
          python -m src.stats.distributions.hypergeometric
          python -m src.stats.distributions.geometric
          python -m src.stats.distributions.negative_binomial
          python -m src.stats.distributions.poisson
          python -m src.stats.distributions.exponential
          python -m src.stats.distributions.weibull
          python -m src.stats.distributions.chi_square
          python -m src.stats.distributions.gamma
          python -m src.stats.distributions.beta
          python -m src.stats.distributions.student_t
          python -m src.stats.distributions.cauchy
          python -m src.stats.distributions.lognormal
          python -m src.stats.distributions.f
          python -m src.stats.skeleton.distributions
          python -m src.Preprocessing.numeric.scaling
          python -m src.Preprocessing.numeric.imputation
          python -m src.Preprocessing.numeric.power
          python -m src.Preprocessing.categorical.imputation
          python -m src.Preprocessing.categorical.encoding
          python -m src.Preprocessing.positional.rope
          python -m src.Preprocessing.feature_pipeline
          python -m src.stats.correlation.numeric.pearson
          python -m src.stats.correlation.numeric.spearman
          python -m src.stats.correlation.numeric.kendall
          python -m src.stats.correlation.categorical.cramers_v
          python -m src.stats.correlation.categorical.phi
          python -m src.stats.correlation.matrix_transform
      - name: Execute optimization skeletons
        run: |
          python -m src.MachineLearning.skeleton.optimization_grid_search
          python -m src.MachineLearning.skeleton.optimization_random_search
          python -m src.MachineLearning.skeleton.optimization_optuna_search
      - name: Execute all evaluation metric examples
        run: python -m examples.evaluation_metric_examples
      - name: Execute regression and genetic examples
        run: |
          python -m examples.regression_distribution_examples
          python -m examples.applied_model_examples
          python -m src.Optimization.skeleton.production_allocation
      - name: Execute Axes visualization examples
        run: python -m examples.eda_visualization_examples
      - name: Verify legacy CLI compatibility
        run: |
          python -m src.stats.tests.parametric.Average.Univariate
          python -m src.stats.tests.parametric.Average.Bivariate
          python -m src.stats.tests.parametric.Average.Multivariate.OneWay
          python -m src.stats.tests.parametric.Average.Multivariate.TwoWay
          python -m src.stats.tests.parametric.Average.Multivariate.PostHoc
          python -m src.stats.tests.parametric.Average.Multivariate.MANOVA
          python -m src.stats.tests.nonParametric.chi_square
          python -m src.stats.tests.nonParametric.independence
          python -m src.stats.tests.nonParametric.mcnemar
  exams:
    runs-on: ubuntu-22.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r 기출문제/requirements-py312.txt
      - name: Execute every reconstructed answer notebook
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          for notebook in sorted(Path('기출문제').rglob('*풀이.ipynb')):
              subprocess.run([sys.executable, 'tools/exams/execute_notebooks.py', str(notebook)], check=True)
          PY
      - name: Audit scenario questions and executed hypothesis answers
        run: python tools/exams/audit_scenarios.py
  tensorflow:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.7'
            requirements: requirements-tensorflow-py37.txt
          - python: '3.12'
            requirements: requirements-tensorflow-py312.txt
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: python -m unittest discover -s tests -p 'test_tensorflow_modules.py' -v
      - run: python -m unittest discover -s tests -p 'test_deep_expansion.py' -v
      - name: Execute TensorFlow module examples
        run: |
          python -m src.DeepLearning.TensorFlow.classification
          python -m src.DeepLearning.TensorFlow.regression
          python -m src.DeepLearning.TensorFlow.rnn
          python -m src.DeepLearning.TensorFlow.time_series
          python -m src.DeepLearning.TensorFlow.cnn
          python -m src.DeepLearning.TensorFlow.simple_rnn
          python -m src.DeepLearning.TensorFlow.lstm
          python -m src.DeepLearning.TensorFlow.gru
