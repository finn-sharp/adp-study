name: Domain architecture extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.7'
            requirements: requirements-domain-py37.txt
          - python: '3.12'
            requirements: requirements-domain-py312.txt
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: python -m unittest discover -s tests -p test_domain_extension.py -v
      - name: Execute every new module and skeleton
        run: python tools/check_domain_examples.py
  catalog:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install nbformat==5.10.4
      - run: python tools/exams/audit_catalog.py
