name: Study modules

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.7'
            requirements: requirements-py37.txt
          - python: '3.12'
            requirements: requirements-review.txt
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install dependencies
        run: python -m pip install -r ${{ matrix.requirements }}
      - name: Install optional boosting dependencies (modern)
        if: matrix.python == '3.12'
        run: python -m pip install xgboost-cpu==3.0.5 lightgbm==4.6.0
      - name: Check modules
        run: python -m unittest discover -s tests -v
      - name: Check extended examples
        run: python -m examples.extended_workflow
      - name: Run examples
        run: python -m examples.study_workflow
      - name: Run multivariate examples
        run: python -m examples.multivariate_workflow
      - name: Run DTO examples
        run: python -m examples.output_dto_workflow
