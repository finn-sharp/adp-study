name: Production optimization mock
on:
  push:
    paths: ['src/**', '기출문제/모의고사/5회/**', 'tools/exams/*production_mock.py', '.github/workflows/production-mock.yml']
  pull_request:
    paths: ['src/**', '기출문제/모의고사/5회/**', 'tools/exams/*production_mock.py', '.github/workflows/production-mock.yml']
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r 기출문제/모의고사/5회/requirements-py312.txt
      - run: python tools/exams/execute_notebooks.py 기출문제/모의고사/5회/모의고사_5회_풀이.ipynb
      - run: python tools/exams/audit_production_mock.py
      - name: Execute standalone solution
        working-directory: 기출문제/모의고사/5회
        run: python 분석코드.py
