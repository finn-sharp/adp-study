name: Researched comprehensive mocks 16-20
on:
  push:
    paths: ['src/**', '기출문제/모의고사/**', 'tools/exams/*researched*.py', '.github/workflows/researched-mocks.yml']
  pull_request:
    paths: ['src/**', '기출문제/모의고사/**', 'tools/exams/*researched*.py', '.github/workflows/researched-mocks.yml']
permissions:
  contents: read
jobs:
  researched-mocks:
    runs-on: ubuntu-22.04
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r 기출문제/모의고사/공통/requirements-py312.txt
      - run: python -m pip install black==24.8.0
      - run: python tools/exams/run_researched_mocks.py
      - run: python tools/exams/audit_researched_mocks.py
      - run: python tools/exams/audit_mock_readability.py
