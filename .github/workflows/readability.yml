name: Source readability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev-py312.txt
      - name: Check source formatting
        run: python -m black --check --workers 1 src 기출문제/모의고사/공통
      - name: Audit every tracked Python module specification
        run: python tools/exams/module_spec.py --check
